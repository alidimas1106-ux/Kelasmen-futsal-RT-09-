<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengocok Angka - Perjuangan Merdeka 1945</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Impact', 'Segoe UI', sans-serif;
      background: radial-gradient(circle, #5c0606 0%, #170101 80%, #000 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
    }

    /* Container Card Tema Perjuangan */
    .war-card {
      background: linear-gradient(180deg, #2b0303 0%, #0d0101 100%);
      border: 4px solid #b91c1c;
      outline: 2px solid #ffd700;
      box-shadow: 0 0 35px rgba(185, 28, 28, 0.7), inset 0 0 25px rgba(0,0,0,0.9);
      border-radius: 20px;
      padding: 24px 18px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      position: relative;
    }

    /* Flag Header Accent */
    .flag-banner {
      height: 8px;
      width: 100%;
      background: linear-gradient(to right, #dc2626 50%, #ffffff 50%);
      margin-bottom: 15px;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .title-sub {
      color: #fca5a5;
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .title {
      font-size: 2rem;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px #dc2626, 3px 3px 0px #000;
      margin-bottom: 20px;
    }

    /* Spin Roulette Wheel Box */
    .spin-box {
      width: 160px;
      height: 160px;
      margin: 0 auto 20px;
      background: radial-gradient(circle, #ffffff 0%, #cbd5e1 100%);
      border: 6px solid #b91c1c;
      border-radius: 50%;
      box-shadow: 0 0 30px #b91c1c, inset 0 0 15px rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .number-display {
      font-size: 5rem;
      font-weight: 900;
      color: #991b1b;
      text-shadow: 2px 2px 0px #000;
    }

    .spinning {
      color: #dc2626;
      animation: spinPulse 0.06s infinite linear;
    }

    @keyframes spinPulse {
      0% { transform: scale(0.9) rotate(-5deg); opacity: 0.8; }
      50% { transform: scale(1.1) rotate(5deg); opacity: 1; }
      100% { transform: scale(0.9) rotate(-5deg); opacity: 0.8; }
    }

    /* Button Styling */
    .btn-group {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.15s ease;
    }

    .btn-spin {
      background: linear-gradient(180deg, #dc2626 0%, #7f1d1d 100%);
      color: #fff;
      border: 1px solid #fca5a5;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.5);
    }
    .btn-spin:hover:not(:disabled) {
      background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%);
      transform: translateY(-2px);
    }

    .btn-reset {
      background: linear-gradient(180deg, #475569 0%, #1e293b 100%);
      color: #cbd5e1;
      border: 1px solid #94a3b8;
    }
    .btn-reset:hover:not(:disabled) {
      background: linear-gradient(180deg, #64748b 0%, #334155 100%);
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none !important;
    }

    /* History List */
    .history-box {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      padding: 12px;
      text-align: left;
      font-family: sans-serif;
    }
    .history-header {
      color: #fca5a5;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .history-list {
      color: #f8fafc;
      max-height: 65px;
      overflow-y: auto;
      font-size: 0.85rem;
      word-wrap: break-word;
    }

    /* ================= SCATTER ANIMATION GARUDA ================= */
    .garuda-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 0, 0, 0.92);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(8px);
    }

    .garuda-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .garuda-card {
      background: radial-gradient(circle, #7f1d1d 0%, #180202 100%);
      border: 4px solid #ffd700;
      box-shadow: 0 0 60px #dc2626, 0 0 20px #ffd700;
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      width: 90%;
      max-width: 350px;
      transform: scale(0.3) rotate(-10deg);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .garuda-overlay.active .garuda-card {
      transform: scale(1) rotate(0deg);
    }

    .garuda-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto;
      filter: drop-shadow(0 0 15px #ffd700);
      animation: garudaFlap 0.8s infinite alternate ease-in-out;
    }

    @keyframes garudaFlap {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.15) translateY(-8px); filter: drop-shadow(0 0 25px #ff0000); }
    }

    .garuda-title {
      font-size: 2.2rem;
      color: #ffd700;
      text-shadow: 0 0 15px #dc2626, 2px 2px 0px #000;
      margin-top: 10px;
      letter-spacing: 2px;
    }

    .garuda-sub {
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 1px;
      margin: 5px 0 15px;
      font-family: sans-serif;
    }

    .twin-badge {
      background: #ffffff;
      color: #991b1b;
      font-size: 3.5rem;
      font-weight: 900;
      border-radius: 12px;
      width: 100px;
      margin: 0 auto 15px;
      border: 3px solid #ffd700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
    }

    .btn-close-garuda {
      background: linear-gradient(180deg, #ffd700 0%, #b45309 100%);
      color: #000;
      font-size: 1rem;
      padding: 10px 25px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 15px #ffd700;
    }
  </style>
</head>
<body>

<div class="war-card">
  <div class="flag-banner"></div>
  <div class="title-sub">INDONESIA VS BELANDA 1945</div>
  <div class="title">BAMBU RUNCING</div>
  
  <div class="spin-box">
    <div class="number-display" id="display">?</div>
  </div>

  <div class="btn-group">
    <button class="btn-spin" id="btnSpin" onclick="startSpin()">SPIN</button>
    <button class="btn-reset" id="btnReset" onclick="resetSpin()">RESET</button>
  </div>

  <div class="history-box">
    <div class="history-header">
      <span>ANGKA TERPAKAI</span>
      <span id="counter">0/99</span>
    </div>
    <div class="history-list" id="history">-</div>
  </div>
</div>

<div class="garuda-overlay" id="garudaModal">
  <div class="garuda-card">
    <svg class="garuda-icon" viewBox="0 0 24 24" fill="#ffd700">
      <path d="M12,2L15,8L21,9L16.5,13.5L18,19.5L12,16.5L6,19.5L7.5,13.5L3,9L9,8L12,2Z"/>
      <path d="M12,4L10,8H14L12,4Z" fill="#dc2626"/>
    </svg>
    <div class="garuda-title">MERDEKA!</div>
    <div class="garuda-sub">ANGKA KEMBAR PERJUANGAN</div>
    <div class="twin-badge" id="twinNum">11</div>
    <button class="btn-close-garuda" onclick="closeGaruda()">BANGKIT!</button>
  </div>
</div>

<script>
  let numbers = [];
  let history = [];
  let isSpinning = false;
  let audioCtx = null;

  function getAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  function playSpinTick() {
    try {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(800, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.03);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.03);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.03);
    } catch(e) {}
  }

  function playGarudaFanfare() {
    try {
      const ctx = getAudioContext();
      const notes = [261.63, 329.63, 392.00, 523.25, 659.25];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + (i * 0.1));
        gain.gain.setValueAtTime(0.2, ctx.currentTime + (i * 0.1));
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (i * 0.1) + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + (i * 0.1));
        osc.stop(ctx.currentTime + (i * 0.1) + 0.3);
      });
    } catch(e) {}
  }

  // FITUR GETAR (VIBRATION API)
  function triggerVibration() {
    if ("vibrate" in navigator) {
      navigator.vibrate([200, 100, 200, 100, 600]);
    }
  }

  function init() {
    numbers = Array.from({ length: 99 }, (_, i) => i + 1);
    history = [];
    isSpinning = false;
    document.getElementById('display').innerText = '?';
    document.getElementById('history').innerText = '-';
    document.getElementById('counter').innerText = '0/99';
    document.getElementById('btnSpin').disabled = false;
    document.getElementById('btnReset').disabled = false;
    document.getElementById('display').classList.remove('spinning');
  }

  function startSpin() {
    if (numbers.length === 0 || isSpinning) return;

    getAudioContext();
    isSpinning = true;
    document.getElementById('btnSpin').disabled = true;
    document.getElementById('btnReset').disabled = true;

    const display = document.getElementById('display');
    display.classList.add('spinning');

    const winnerIndex = Math.floor(Math.random() * numbers.length);
    const winnerNumber = numbers[winnerIndex];

    // DIBUAT LEBIH LAMA DENGAN PENAMBAHAN DURASI
    let speed = 25;       // Kecepatan awal (ms)
    let ticks = 0;
    const minTicks = 60;  // Putaran cepat diperbanyak dari 30 ke 60 kali (~1.5 detik)

    function spinStep() {
      display.innerText = Math.floor(Math.random() * 99) + 1;
      playSpinTick();
      ticks++;

      if (ticks < minTicks) {
        setTimeout(spinStep, speed);
      } else if (speed < 400) { // Diperlambat secara bertahap sampai jeda 400ms (efek dramatis)
        speed += 18; 
        setTimeout(spinStep, speed);
      } else {
        numbers.splice(winnerIndex, 1);
        history.push(winnerNumber);

        display.innerText = winnerNumber;
        display.classList.remove('spinning');

        document.getElementById('history').innerText = history.join(', ');
        document.getElementById('counter').innerText = history.length + '/99';

        isSpinning = false;
        document.getElementById('btnReset').disabled = false;

        // Jika angka kembar
        if (winnerNumber % 11 === 0) {
          triggerGaruda(winnerNumber);
        } else {
          if (numbers.length > 0) {
            document.getElementById('btnSpin').disabled = false;
          } else {
            alert('Semua angka perjuangan (1-99) sudah keluar!');
          }
        }
      }
    }

    spinStep();
  }

  function triggerGaruda(num) {
    document.getElementById('twinNum').innerText = num;
    document.getElementById('garudaModal').classList.add('active');
    playGarudaFanfare();
    triggerVibration();
  }

  function closeGaruda() {
    document.getElementById('garudaModal').classList.remove('active');
    if (numbers.length > 0) {
      document.getElementById('btnSpin').disabled = false;
    } else {
      alert('Semua angka telah dikocok!');
    }
  }

  function resetSpin() {
    if (isSpinning) return;
    init();
  }

  init();
</script>

</body>
</html>
