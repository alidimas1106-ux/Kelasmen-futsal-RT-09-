<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selamat Pagi Vivi Apryani 🌸✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #ffe6ea 0%, #ffc0cb 50%, #ffe4e1 100%);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.93);
      border-radius: 28px;
      padding: 30px 22px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 35px rgba(255, 105, 180, 0.25);
      border: 3px solid #ffb6c1;
      position: relative;
      z-index: 10;
    }
    h1 {
      font-family: 'Fredoka', cursive;
      color: #ff477e;
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .flower-avatar {
      font-size: 3.8rem;
      animation: float 2.5s infinite ease-in-out;
      margin-bottom: 10px;
      display: inline-block;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }
    .box-section {
      background: #fff0f3;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 18px;
      border: 1.5px dashed #ff85a1;
    }
    .box-section h3 {
      color: #ff477e;
      font-size: 1rem;
      margin-bottom: 12px;
    }
    .btn-grid {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-cute {
      background: #ff7597;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      box-shadow: 0 4px 10px rgba(255, 117, 151, 0.3);
    }
    .btn-cute:hover {
      background: #ff477e;
      transform: scale(1.05);
    }
    .btn-gift {
      background: linear-gradient(45deg, #ff477e, #ff7597);
      color: white;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      border-radius: 25px;
      margin-top: 5px;
    }
    #response-text {
      min-height: 48px;
      color: #d63384;
      font-weight: bold;
      font-size: 0.9rem;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
    }
    /* Kelopak Bunga Jatuh */
    .floating-flower {
      position: fixed;
      top: -10px;
      font-size: 1.4rem;
      user-select: none;
      pointer-events: none;
      animation: fall linear forwards;
      z-index: 1;
    }
    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="flower-avatar">🌸🧸🌸</div>
    <h1>Selamat Pagi, Vivi Apryani! ✨</h1>
    <p class="subtitle">Sistem pendeteksi bunga imut mencatat Bidadari Siap Menyambut Hari Ini ~ 💖</p>

    <div class="box-section">
      <h3>Pilih Mood Vivi Pagi Ini:</h3>
      <div class="btn-grid">
        <button class="btn-cute" onclick="setMood('ngantuk')">😴 Masih Ngantuk</button>
        <button class="btn-cute" onclick="setMood('semangat')">☀️ Siap Beraktivitas</button>
        <button class="btn-cute" onclick="setMood('kangen')">🥰 Kangen Kamu</button>
      </div>
      <div id="response-text">Tekan salah satu tombol di atas ya, Cantik! 👆</div>
    </div>

    <button class="btn-cute btn-gift" onclick="getGift()">🌸 Buka Hadiah Bunga Spesial 🎁</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script>
    // Efek Bunga dan Hati Jatuh
    function createFlower() {
      const items = ['🌸', '🌺', '🌷', '🌼', '✨', '💖', '💐'];
      const element = document.createElement('div');
      element.classList.add('floating-flower');
      element.innerText = items[Math.floor(Math.random() * items.length)];
      element.style.left = Math.random() * 100 + 'vw';
      element.style.animationDuration = Math.random() * 3 + 2.5 + 's';
      element.style.opacity = Math.random();
      document.body.appendChild(element);

      setTimeout(() => {
        element.remove();
      }, 5500);
    }
    setInterval(createFlower, 300);

    // Respon Tombol Mood
    function setMood(type) {
      const resp = document.getElementById('response-text');
      if (type === 'ngantuk') {
        resp.innerHTML = "🚨 Deteksi: Vivi butuh pasokan pelukan hangat & teh manis hangat pagi ini! ☕💕";
      } else if (type === 'semangat') {
        resp.innerHTML = "✨ Wah keren! Semangat terus hari ini Vivi Apryani, jangan lupa senyum cantiknya! 🏆🌸";
      } else if (type === 'kangen') {
        resp.innerHTML = "🫣 Sama dong! Kadar kangen aku ke Vivi juga sudah tembus 1000% pagi ini! 💖";
      }
    }

    // Hadiah Kejutan
    function getGift() {
      confetti({
        particleCount: 90,
        spread: 80,
        origin: { y: 0.6 },
        colors: ['#ff477e', '#ff7597', '#ffc0cb', '#ffffff']
      });

      setTimeout(() => {
        alert("✨ PESAN SPESIAL UNTUK VIVI APRYANI ✨\n\nSelamat pagi Princess Vivi! 🌸\n\nJangan lupa sarapan, minum air putih yang cukup, dan jaga kesehatan ya. Semangat terus buat hari ini, aku bakal selalu dukung dan kangen kamu! 🥰💖");
      }, 300);
    }
  </script>
</body>
</html>
